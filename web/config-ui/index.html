<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Voice Reply Config</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="project-pane">
        <div class="pane-header">
          <div>
            <p class="eyebrow">Codex Voice Reply</p>
            <h1 data-i18n="appTitle">项目语音配置</h1>
          </div>
          <button id="refreshButton" class="icon-button" type="button" title="刷新项目列表">↻</button>
        </div>

        <label class="language-select">
          <span data-i18n="language">语言</span>
          <select id="languageSelect" aria-label="Language">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </label>

        <section class="utility-panel" aria-labelledby="autoAssignTitle">
          <div>
            <h3 id="autoAssignTitle" data-i18n="autoAssignTitle">自动写入配置</h3>
            <p class="helper-text" data-i18n="autoAssignHelp">系统会先按项目名和路径关键词选择模式；没有命中时，再按项目路径稳定分配一个模式，让不同项目默认有不同声音。</p>
          </div>
          <label class="choice-row">
            <input type="radio" name="autoApplyMode" value="missing" checked />
            <span data-i18n="autoMissing">给尚未配置的项目根据项目特性自动配置</span>
          </label>
          <label class="choice-row">
            <input type="radio" name="autoApplyMode" value="overwrite" />
            <span data-i18n="autoOverwrite">给所有项目按照项目特性自动配置</span>
          </label>
          <button id="autoAssignButton" class="secondary-button wide-button" type="button" data-i18n="autoAssignButton">按规则写入项目配置</button>
        </section>

        <section class="utility-panel" aria-labelledby="autostartTitle">
          <div>
            <h3 id="autostartTitle" data-i18n="fixedAddressTitle">固定地址</h3>
            <p class="helper-text" data-i18n="fixedAddressHelp">开启后，本机会在 Codex 启动时固定配置网页地址。</p>
          </div>
          <label class="check-row compact-check">
            <input id="configUiAutostart" type="checkbox" />
            <span data-i18n="fixedAddressToggle">在 Codex 启动时固定配置网页地址</span>
          </label>
          <p id="autostartDetails" class="helper-text muted-detail" data-i18n="fixedAddressLoading">正在读取固定地址状态...</p>
        </section>

        <label class="search-box">
          <span data-i18n="search">搜索</span>
          <input id="projectSearch" type="search" placeholder="项目名或路径" autocomplete="off" data-i18n-placeholder="searchPlaceholder" />
        </label>

        <div id="projectList" class="project-list" aria-live="polite"></div>
      </aside>

      <section class="config-pane">
        <header class="config-header">
          <div>
            <p id="workspaceLabel" class="eyebrow">Workspace</p>
            <h2 id="selectedProjectName" data-i18n="selectProject">选择一个项目</h2>
            <p id="selectedProjectPath" class="path-text" data-i18n="selectProjectHelp">启动本地配置服务后，会在这里显示可配置的 Codex 项目。</p>
          </div>
          <div id="voiceStatus" class="status-pill" data-i18n="notSelected">未选择</div>
        </header>

        <form id="configForm" class="config-grid">
          <section class="panel main-panel">
            <div class="tag-picker">
              <span data-i18n="projectVoiceMode">项目语音模式</span>
              <select id="projectTagSelect" name="projectTag" hidden></select>
              <select id="settingsFileSelect" name="settingsFile" hidden></select>
              <select id="strategySelect" name="strategy" hidden></select>
              <select id="modeSelect" name="modeOverride" hidden></select>
              <input id="voiceIdentityLabel" name="voiceIdentityLabel" type="hidden" />
              <div id="projectTagCards" class="tag-card-grid" role="radiogroup" aria-label="项目语音模式"></div>
            </div>

            <div class="field-row">
              <div class="voice-picker">
                <span data-i18n="defaultVoice">默认声音</span>
                <div class="inline-control">
                  <select id="voiceSelect" name="voiceOverride"></select>
                  <button id="voicePreviewButton" class="secondary-button preview-button" type="button" data-i18n="preview">试听</button>
                </div>
                <audio id="voicePreviewAudio" class="preview-audio" controls hidden></audio>
              </div>
            </div>

            <section class="custom-voice-panel" aria-labelledby="customVoiceTitle">
              <div>
                <h3 id="customVoiceTitle" data-i18n="customVoiceTitle">按偏好生成播报声音</h3>
                <p class="helper-text" data-i18n="customVoiceHelp">写下你希望这个项目听起来像什么，系统会生成一个可试听、可写入的声音方案。</p>
              </div>
              <label>
                <span data-i18n="customVoiceName">声音名字</span>
                <input id="customVoiceName" type="text" data-i18n-placeholder="customVoiceNamePlaceholder" placeholder="例如：阶段汇报小稳" />
              </label>
              <textarea id="customVoicePrompt" rows="3" data-i18n-placeholder="customVoicePlaceholder" placeholder="例如：温柔一点，少打扰，像产品经理做阶段汇报。"></textarea>
              <div class="actions compact-actions">
                <button id="generateCustomVoiceButton" class="secondary-button" type="button" data-i18n="generateCustomVoice">生成并试听</button>
                <button id="saveCustomVoiceButton" class="primary-button" type="button" data-i18n="saveCustomVoice">保存到项目</button>
                <button id="clearCustomVoiceButton" class="secondary-button" type="button" data-i18n="clearCustomVoice">清除自定义</button>
              </div>
              <p id="customVoiceSummary" class="helper-text muted-detail" data-i18n="customVoiceEmpty">尚未生成自定义声音方案。</p>
            </section>

            <label>
              <span data-i18n="notes">备注</span>
              <textarea id="notesInput" name="notes" rows="4" placeholder="写给维护者或后续 Codex 的简短说明" data-i18n-placeholder="notesPlaceholder"></textarea>
            </label>

            <label class="check-row">
              <input id="suppressAllSpeech" name="suppressAllSpeech" type="checkbox" />
              <span data-i18n="disableVoiceForProject">本项目完全禁用语音</span>
            </label>

            <div class="actions">
              <button id="applyButton" class="primary-button" type="submit" data-i18n="applyConfig">提交配置</button>
              <button id="copyJsonButton" class="secondary-button" type="button" data-i18n="copyJson">复制 JSON</button>
            </div>
          </section>

          <section class="panel side-panel">
            <div>
              <h3 data-i18n="currentVoice">当前声音</h3>
              <dl id="voiceDetails" class="details-list"></dl>
            </div>
            <div>
              <h3 data-i18n="pendingWrite">即将写入</h3>
              <pre id="jsonPreview" class="json-preview">{}</pre>
            </div>
          </section>
        </form>

        <div id="messageBar" class="message-bar" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
